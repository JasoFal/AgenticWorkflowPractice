name: ci

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: React Router v8 requires >=22.22, Vite 8 requires >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run build
