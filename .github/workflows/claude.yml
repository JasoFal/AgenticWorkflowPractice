name: Claude

# Responds to @claude mentions in issue and PR comments. Dormant until the
# Claude GitHub App is installed and ANTHROPIC_API_KEY is set as a repository
# secret. See CLAUDE.md section 12.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
